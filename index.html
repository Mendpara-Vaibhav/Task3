<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <table
      class="table-active table-bordered border-primary d-flex justify-content-center mt-5"
    >
      <tr>
        <td>
          <form
            class="form-control"
            id="form"
            onsubmit="event.preventDefault(); onFormSubmit(); "
          >
            <div>
              <label class="form-label" for="name">Movie Name:</label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                required
              />
            </div>
            <div>
              <label for="rating">Rating:</label>
              <select
                class="form-select"
                aria-label="Default select example"
                id="rating"
                name="rating"
                required
              >
                <option value="">Dropdown List</option>
                <option value="Poor">Poor</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
                <option value="Nice">Nice</option>
                <option value="Excellent">Excellent</option>
              </select>
            </div>
            <div class="d-grid gap-2 col-6 mx-auto">
              <input class="btn btn-primary" type="submit" value="Submit" />
            </div>
          </form>
        </td>
      </tr>
    </table>
    <div class="d-flex justify-content-center">
      <table
        class="table table-striped table-info table-bordered border-primary m-5"
      >
        <thead>
          <tr>
            <th>Poor</th>
            <th>Btn</th>
          </tr>
        </thead>
        <tbody id="poor"></tbody>
      </table>

      <table
        class="table table-striped table-info table-bordered border-primary m-5"
      >
        <thead>
          <tr>
            <th>Average</th>
            <th>Btn</th>
          </tr>
        </thead>
        <tbody id="average"></tbody>
      </table>

      <table
        class="table table-striped table-info table-bordered border-primary m-5"
      >
        <thead>
          <tr>
            <th>Good</th>
            <th>Btn</th>
          </tr>
        </thead>
        <tbody id="good"></tbody>
      </table>

      <table
        class="table table-striped table-info table-bordered border-primary m-5"
      >
        <thead>
          <tr>
            <th>Nice</th>
            <th>Btn</th>
          </tr>
        </thead>
        <tbody id="nice"></tbody>
      </table>

      <table
        class="table table-striped table-info table-bordered border-primary m-5"
      >
        <thead>
          <tr>
            <th>Excellent</th>
            <th>Btn</th>
          </tr>
        </thead>
        <tbody id="excellent"></tbody>
      </table>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
